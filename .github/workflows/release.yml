# Releases the plugins. Each one is built with its own build.sh (lint and tests included) and its zip is
# published as the GitHub Release <plugin>-v<version>, the version being the one in the plugin's source
# (.github/version.sh). The release <plugin>-latest then gets the same zip under its stable name
# (.github/update-latest.sh).
#
# On a push to main — the mirror from the MPS monorepo — every plugin whose version is not released yet
# is released; the others are left alone. So a release is: bump the version and its changelog entry in
# MPS, merge to master.
#
# By hand: Actions › Release, or gh workflow run release.yml -f plugin=woocommerce. A version already
# released is refused. With publish off it only builds, and leaves the zips as a workflow artifact.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to release
        type: choice
        options: [woocommerce, magento, prestashop, odoo]
      publish:
        description: Publish the GitHub Release (off = build only)
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      plugins: ${{ steps.plan.outputs.plugins }}
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_PLUGIN: ${{ inputs.plugin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Which plugins to release
        id: plan
        run: |
          set -euo pipefail
          plugins=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            plugins=("$INPUT_PLUGIN")
          else
            for plugin in woocommerce magento prestashop odoo; do
              tag="$plugin-v$(.github/version.sh "$plugin")"
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "$tag is released already"
              else
                echo "$tag is new"
                plugins+=("$plugin")
              fi
            done
          fi
          echo "plugins=$(jq -cn '$ARGS.positional' --args "${plugins[@]}")" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.plugins != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.plan.outputs.plugins) }}
    concurrency:
      group: release-${{ matrix.plugin }}
    env:
      PLUGIN: ${{ matrix.plugin }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        # Odoo's tests run in a pod, which only podman has; the others use docker.
        run: |
          if [[ "$PLUGIN" == odoo ]]; then export CONTAINER_CLI=podman; fi
          "./$PLUGIN/build.sh"

      - name: Version and notes
        id: meta
        run: |
          set -euo pipefail
          version="$(.github/version.sh "$PLUGIN")"
          cd "$PLUGIN/dist"

          # The merchant's zip only: the stable-name copy is the same file, and WooCommerce's
          # Marketplace zip is uploaded to Woo.com, not installed from here.
          zips=$(ls *-"$version".zip | grep -v marketplace)

          # This version's changelog entry: CHANGELOG.md "## <version>", or WooCommerce's readme.txt
          # "= <version> =".
          if [[ -f ../CHANGELOG.md ]]; then
            awk -v v="## $version" '$0 == v { on = 1; next } on && /^## / { exit } on' ../CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          else
            awk -v v="= $version =" '$0 == v { on = 1; next } on && /^= / { exit } on' ../mps-payments/readme.txt > "$RUNNER_TEMP/notes.md"
          fi

          {
            echo "version=$version"
            echo "tag=$PLUGIN-v$version"
            echo "zips=$(echo $zips)"
          } >> "$GITHUB_OUTPUT"
          echo "$PLUGIN $version: $zips"

      - name: Keep the zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.tag }}
          path: ${{ matrix.plugin }}/dist/*.zip

      - name: Publish the release
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; bump the version to release again" >&2
            exit 1
          fi
          cd "$PLUGIN/dist"
          gh release create "$tag" ${{ steps.meta.outputs.zips }} \
            --target "$GITHUB_SHA" \
            --title "$PLUGIN ${{ steps.meta.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Point <plugin>-latest at it
        if: env.PUBLISH == 'true'
        run: .github/update-latest.sh "$PLUGIN" "${{ steps.meta.outputs.version }}"
